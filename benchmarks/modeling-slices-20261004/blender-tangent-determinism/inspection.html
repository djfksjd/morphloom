<!doctype html><meta charset="utf-8"><title>Tangent profile inspection</title><style>body{font:14px sans-serif;background:#eee;margin:16px}.row{display:flex;gap:12px}canvas{display:block}p{margin:8px 0}</style><h2>Actual GLB normal-map inspection · fixed camera/light · 512×512</h2><div class="row"><div><p>Default Blender execution</p><div id="before"></div></div><div><p>Single-thread profile</p><div id="after"></div></div></div><p id="status">Loading actual GLB files…</p><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const loaded=await Promise.all(['before','after'].map(n=>new GLTFLoader().loadAsync('./'+n+'.glb')));const results=[],buffers=[];let camera;const candidates=loaded.map(g=>{g.scene.updateMatrixWorld(true);const m=new Map();g.scene.traverse(o=>{if(o.isMesh&&o.geometry.getAttribute('tangent'))m.set(o.name,o);});return m;});let targets,worstVertex=0,worstAngle=0,targetName;
for(const [name,first]of candidates[0]){const second=candidates[1].get(name);if(!second)throw Error('Mesh correspondence absent');const ta=first.geometry.getAttribute('tangent'),tb=second.geometry.getAttribute('tangent');if(ta.count!==tb.count)throw Error('Tangent count mismatch');for(let i=0;i<ta.count;i++){if(ta.getX(i)===tb.getX(i)&&ta.getY(i)===tb.getY(i)&&ta.getZ(i)===tb.getZ(i)&&ta.getW(i)===tb.getW(i))continue;const a=new T.Vector3().fromBufferAttribute(ta,i),b=new T.Vector3().fromBufferAttribute(tb,i);const angle=a.angleTo(b);if(angle>worstAngle){worstAngle=angle;worstVertex=i;targets=[first,second];targetName=name;}}}if(!targets||worstAngle===0)throw Error('No changed tangent region to inspect');
for(let i=0;i<2;i++){
 const scene=new T.Scene();scene.background=new T.Color('#7b7b7b');scene.add(loaded[i].scene);scene.updateMatrixWorld(true);let target;
 loaded[i].scene.traverse(o=>{if(o.isMesh){o.visible=o.name===targetName;if(o.visible)target=o;}});if(!target)throw Error('Actual changed mesh absent');
 if(!camera){const center=target.getVertexPosition(worstVertex,new T.Vector3()).applyMatrix4(target.matrixWorld),normal=new T.Vector3().fromBufferAttribute(target.geometry.getAttribute('normal'),worstVertex).applyNormalMatrix(new T.Matrix3().getNormalMatrix(target.matrixWorld));const span=new T.Box3().setFromObject(target).getSize(new T.Vector3()).y*.10;camera=new T.OrthographicCamera(-span/2,span/2,span/2,-span/2,.001,20);camera.position.copy(center).addScaledVector(normal,1);if(Math.abs(normal.y)>.95)camera.up.set(0,0,1);camera.lookAt(center);camera.updateProjectionMatrix();}
 scene.add(new T.AmbientLight(0xffffff,.65));const light=new T.DirectionalLight(0xffffff,2);light.position.set(3,5,4);scene.add(light);
 const renderer=new T.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(512,512);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NoToneMapping;renderer.render(scene,camera);document.getElementById(i?'after':'before').append(renderer.domElement);
 const gl=renderer.getContext(),pixels=new Uint8Array(512*512*4);gl.readPixels(0,0,512,512,gl.RGBA,gl.UNSIGNED_BYTE,pixels);buffers.push(pixels);const materials=Array.isArray(target.material)?target.material:[target.material];results.push({mesh:target.name,vertices:target.geometry.getAttribute('position').count,tangentAccessor:!!target.geometry.getAttribute('tangent'),normalMappedMaterials:materials.filter(m=>m.normalMap).length,renderer:gl.getParameter(gl.RENDERER)});
}
let changed=0,max=0;for(let i=0;i<buffers[0].length;i++){const d=Math.abs(buffers[0][i]-buffers[1][i]);if(d)changed++;max=Math.max(max,d);}window.inspection={results,changedChannels:changed,maxChannelDifference:max,byteExact:changed===0,resolution:[512,512],targetName,worstVertex,worstAngleDeg:worstAngle*180/Math.PI,scope:'actual GLTFLoader normal-map material and raw TANGENT rendering; neutral worst-tangent vertex closeup; no accuracy/expert/production approval'};document.getElementById('status').textContent=JSON.stringify(window.inspection);
</script>
